<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Копайлот</title>
<link rel="stylesheet" href="/panel.css">
</head>
<body>
<!-- Разметка — по дизайну в Claude Design (docs/architecture.md, фаза 4); поля — web/panel-state.schema.json. -->
<div class="panel" id="panel">
<div class="layout">

<header class="head area-head">
  <div class="head-part"><strong id="guide-title">Копайлот</strong><span id="guide-part"></span></div>
  <span class="status head-status"><span class="dot" id="dot-head"></span><span id="status-head"></span></span>
  <button class="timer" type="button" id="clock" title="Начать отсчёт интервью заново">00:00 <small>/ 60</small></button>
  <button class="icon-btn hidden" type="button" id="pin" aria-pressed="true" aria-label="Поверх остальных окон" title="Поверх остальных окон">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"></path><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"></path></svg>
  </button>
</header>

<section class="timeline area-timeline" aria-label="Блоки гайда">
  <h2 class="label wide-only" id="tl-title">Блоки гайда</h2>
  <ol class="tl" id="timeline"></ol>
  <p class="tl-summary" id="tl-summary"></p>
  <p class="behind wide-only hidden" id="tl-behind"></p>
</section>

<section class="card ask area-ask" id="ask" aria-label="Следующий вопрос">
  <div class="ask-meta"><span class="chip hidden" id="topic"></span><span class="fills" id="fills"></span><span class="ask-state" id="ask-state"></span></div>
  <p class="question none" id="question">Подсказка появится после первых реплик.</p>
  <div class="ask-actions">
    <button class="btn primary" type="button" id="skip" title="Спрошу другое — дай следующий вопрос">Пропустить <kbd>S</kbd></button>
    <button class="btn" type="button" id="refresh" title="Обновить подсказку сейчас">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>Обновить <kbd>⌃⌥H</kbd>
    </button>
  </div>
  <p class="skipped hidden" id="skipped"></p>
  <p class="canon" id="canon"></p>
</section>

<section class="flags area-flags" id="flags" aria-label="Флажки"></section>

<section class="card area-tasks" aria-label="Задачи респондента">
  <div class="section-head"><h2 class="label">Задачи респондента</h2></div>
  <p class="focus hidden" id="focus"></p>
  <ol class="tasks" id="tasks"></ol>
  <p class="above hidden" id="above"></p>
</section>

<section class="card area-slots" id="slots-card" aria-label="Что собрано по задаче">
  <div class="section-head"><h2 class="label" id="slots-title">Собрано по задаче</h2></div>
  <p class="empty-note hidden" id="slots-empty">Задача для прокопки ещё не выбрана.</p>
  <div class="slots" id="slots"></div>
</section>

<section class="guide area-guide" aria-label="Из гайда">
  <details class="fold hidden" id="guide-fold"><summary id="guide-fold-title">Из гайда</summary><div class="fold-body" id="guide-fold-body"></div></details>
  <details class="fold hidden" id="stop-fold"><summary>Стоп-лист</summary><div class="fold-body stop" id="stop-body"></div></details>
</section>

<footer class="foot area-foot">
  <span class="status"><span class="dot" id="dot"></span><span id="status"></span></span>
  <span class="heard" id="heard"></span>
  <span id="context"></span>
</footer>

</div>
</div>
<script src="/panel.js"></script>
</body>
</html>

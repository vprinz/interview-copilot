<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Копайлот</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1c1b19; --dim: #77736b; --line: #e4e1da;
    --ok: #2f7d4f; --ok-bg: #e6f2ea; --warn: #9a6200; --warn-bg: #fdf1d6; --empty: #b3261e; --empty-bg: #fbe9e7;
    --accent: #2b4c9b; --flash: #fff3b0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --card: #222226; --ink: #ecebe7; --dim: #9a968d; --line: #34343a;
      --ok: #7fcf9c; --ok-bg: #1d3327; --warn: #f0c063; --warn-bg: #3a2f14; --empty: #ff8a80; --empty-bg: #3d1f1c;
      --accent: #9db8ff; --flash: #4a4416;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 14px/1.35 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; padding: 10px 12px; max-width: 460px; margin: 0 auto; }
  h2 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 12px 0 5px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .flash { animation: flash 2.5s ease-out; }
  @keyframes flash { from { background: var(--flash); } }

  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .block { font-size: 17px; font-weight: 650; }
  .block::first-letter { text-transform: uppercase; }
  .clock { font: 600 17px/1 ui-monospace, "SF Mono", Menlo, monospace; cursor: pointer; white-space: nowrap; }
  .clock small { font-weight: 400; color: var(--dim); font-size: 12px; }
  .clock.late { color: var(--empty); }
  .bar { position: relative; height: 6px; border-radius: 3px; background: var(--line); margin: 8px 0 6px; overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--accent); border-radius: 3px; }
  .bar b { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--bg); }
  .ahead { color: var(--dim); font-size: 13px; }

  .question { font-size: 18px; line-height: 1.28; font-weight: 550; border-left: 4px solid var(--accent); }
  .question.none { color: var(--dim); font-weight: 400; font-size: 14px; }

  .flags { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
  .flags li { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 5px 10px; font-size: 13px; }

  .tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .tasks li { padding: 3px 10px; border-radius: 8px; color: var(--dim); border: 1px solid transparent; }
  .tasks li.dig { padding: 5px 10px; color: var(--ink); background: var(--card); border-color: var(--accent); font-weight: 600; }
  .tasks li.dig small { display: block; font-weight: 400; color: var(--dim); }

  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .slot { border-radius: 8px; padding: 4px 9px; font-size: 13px; line-height: 1.25; }
  .slot b { display: block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .slot.ok { background: var(--ok-bg); } .slot.ok b { color: var(--ok); }
  .slot.vague { background: var(--warn-bg); } .slot.vague b { color: var(--warn); }
  .slot.empty { background: var(--empty-bg); border: 1px dashed var(--empty); color: var(--empty); } .slot.empty b { color: var(--empty); }

  .canon { color: var(--dim); font-size: 12px; margin-top: 10px; }
  footer { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; display: grid; gap: 6px; }
  .status { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.listen { background: var(--ok); } .dot.think { background: var(--warn); animation: pulse 1s infinite; } .dot.error { background: var(--empty); }
  @keyframes pulse { 50% { opacity: .3; } }
  .heard { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; font-size: 12px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; margin-left: auto; white-space: nowrap; }
</style>
</head>
<body>
  <div class="top">
    <div class="block" id="block">Копайлот</div>
    <div class="clock" id="clock" title="Нажми, чтобы начать отсчёт интервью заново">00:00 <small>/ 60</small></div>
  </div>
  <div class="bar" id="bar"><i id="progress"></i></div>
  <div class="ahead" id="ahead"></div>

  <h2>Спроси</h2>
  <div class="card question none" id="question">Подсказка появится после первых реплик.</div>
  <ul class="flags" id="flags"></ul>

  <h2 id="tasks-title">Задачи респондента</h2>
  <ul class="tasks" id="tasks"></ul>

  <h2 id="slots-title">Что собрано по задаче</h2>
  <div class="slots" id="slots"></div>

  <div class="canon" id="canon"></div>

  <footer>
    <div class="status"><span class="dot" id="dot"></span><span id="status"></span>
      <button id="refresh" title="Control + Option + H">Обновить ⌃⌥H</button></div>
    <div class="heard" id="heard"></div>
  </footer>

<script>
const $ = id => document.getElementById(id);
const SLOT_NAMES = { результат: "Ожидаемый результат", критерии: "Критерии успеха", контекст: "Контекст", триггер: "Триггер",
                     выше: "Задача выше", эмоции: "Эмоции", частота: "Частота", важность: "Важность" };
// Границы блоков по канону на 60 минут: контакт 5, квалификация 15, карта задач 22, прокопка 52, продажа 58.
const MARKS = [5, 15, 22, 52, 58];
const shown = {};

function put(id, html, flash = true) {
  if (shown[id] === html) return;
  const first = shown[id] === undefined;
  shown[id] = html;
  const node = $(id);
  node.innerHTML = html;
  if (flash && !first) {
    node.classList.remove("flash");
    void node.offsetWidth;
    node.classList.add("flash");
  }
}
const esc = text => String(text).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const mmss = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");

function render(s) {
  const total = s.minutes * 60;
  put("clock", `${mmss(s.elapsed)} <small>/ ${s.minutes}</small>`, false);
  $("clock").classList.toggle("late", s.elapsed > total);
  $("progress").style.width = Math.min(100, s.elapsed / total * 100) + "%";
  put("block", esc(s.block || "Копайлот"));
  put("ahead", s.ahead ? "Впереди: " + esc(s.ahead) : "", false);

  $("question").classList.toggle("none", !s.question);
  put("question", esc(s.question || "Подсказка появится после первых реплик."));
  put("flags", s.flags.map(flag => `<li>${esc(flag)}</li>`).join(""));

  put("tasks", s.tasks.length
    ? s.tasks.map((task, i) => i === s.dig
        ? `<li class="dig">${esc(task)}<small>копать: ${esc(s.why)}</small></li>`
        : `<li>${esc(task)}</li>`).join("")
    : `<li>пока не названы</li>`);
  if (s.tasks.length && s.dig === null) shown.tasks = undefined, $("tasks").insertAdjacentHTML("beforeend", `<li>задача для прокопки ещё не выбрана</li>`);
  $("slots-title").hidden = $("slots").hidden = s.dig === null;
  put("slots", s.slots.map(slot => {
    const kind = slot.mark === "✓" ? "ok" : slot.mark === "≈" ? "vague" : "empty";
    const text = slot.mark === "✗" ? "" : (slot.mark === "≈" ? "≈ " : "") + esc(slot.text || "есть");
    return `<div class="slot ${kind}"><b>${SLOT_NAMES[slot.name] || slot.name}</b>${text}</div>`;
  }).join(""), false);
  put("canon", s.canon ? "Канон: " + esc(s.canon) : "", false);

  $("dot").className = "dot " + ({ "слушаю": "listen", "думаю": "think", "ошибка": "error" }[s.status] || "");
  let status = s.status + (s.note ? " — " + s.note : "");
  if (s.updated) status += ` · обновлено ${Math.max(0, Math.round(s.now - s.updated))} с назад`;
  if (s.status === "слушаю" && s.waiting) status += ` · следующее через ${s.next} с`;
  if (s.context > 150000) status += ` · контекст сессии ${Math.round(s.context / 2000)}%`;
  put("status", esc(status), false);
  put("heard", esc(s.heard), false);
}

async function tick() {
  try {
    render(await (await fetch("/state")).json());
  } catch (error) {
    put("status", "нет связи с копайлотом", false);
    $("dot").className = "dot error";
  }
}

$("bar").insertAdjacentHTML("beforeend", MARKS.map(m => `<b style="left:${m / 60 * 100}%"></b>`).join(""));
$("refresh").onclick = () => fetch("/refresh", { method: "POST" });
$("clock").onclick = () => confirm("Начать отсчёт интервью заново с этого момента?") && fetch("/restart-clock", { method: "POST" });
document.addEventListener("keydown", event => {
  if (event.code === "Space") { event.preventDefault(); fetch("/refresh", { method: "POST" }); }
});
setInterval(tick, 500);
tick();
</script>
</body>
</html>
